version: "3.9"

services:

  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - taskflow-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine
    container_name: taskflow-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    networks:
      - taskflow-network

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    container_name: taskflow-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "3000:3000"

    networks:
      - taskflow-network

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5


  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL} # Passes it from your machine to the build process
    container_name: taskflow-frontend

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy


    ports:
      - "80:80"

    networks:
      - taskflow-network


volumes:

  postgres-data:


networks:

  taskflow-network: