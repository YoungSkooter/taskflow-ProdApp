```yaml
name: TaskFlow CI/CD

on:
  push:
    branches:
      - main
      - dev
      - staging

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

  FRONTEND_REPOSITORY: taskflow-frontend
  BACKEND_REPOSITORY: taskflow-backend

  K8S_REPO: your-github-username/taskflow-k8s
  K8S_BRANCH: main

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      #########################################################
      # Checkout
      #########################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      #########################################################
      # Setup Node
      #########################################################

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      #########################################################
      # Frontend
      #########################################################

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      #########################################################
      # Backend
      #########################################################

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Build Backend
        working-directory: backend
        run: npm run build --if-present

      #########################################################
      # AWS Credentials
      #########################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      #########################################################
      # Login to ECR
      #########################################################

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      #########################################################
      # Image Tag
      #########################################################

      - name: Set Image Tag
        id: vars
        run: echo "TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      #########################################################
      # Trivy Filesystem Scan
      #########################################################

      - name: Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1

      #########################################################
      # Build Backend Image
      #########################################################

      - name: Build Backend Image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:latest \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:${{ steps.vars.outputs.TAG }} \
            ./backend

      #########################################################
      # Build Frontend Image
      #########################################################

      - name: Build Frontend Image
        run: |
          docker build \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:latest \
            -t ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:${{ steps.vars.outputs.TAG }} \
            ./frontend

      #########################################################
      # Trivy Image Scan - Backend
      #########################################################

      - name: Scan Backend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:${{ steps.vars.outputs.TAG }}
          severity: HIGH,CRITICAL
          exit-code: 1

      #########################################################
      # Trivy Image Scan - Frontend
      #########################################################

      - name: Scan Frontend Image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:${{ steps.vars.outputs.TAG }}
          severity: HIGH,CRITICAL
          exit-code: 1

      #########################################################
      # Push Images
      #########################################################

      - name: Push Backend Image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:${{ steps.vars.outputs.TAG }}

      - name: Push Frontend Image
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:${{ steps.vars.outputs.TAG }}

      #########################################################
      # Clone Kubernetes Repository
      #########################################################

      - name: Clone taskflow-k8s
        run: |
          git clone https://x-access-token:${{ secrets.K8S_REPO_TOKEN }}@github.com/${{ env.K8S_REPO }}.git

      #########################################################
      # Update Backend Deployment
      #########################################################

      - name: Update Backend Image
        run: |
          sed -i "s|image: .*taskflow-backend:.*|image: ${{ steps.login-ecr.outputs.registry }}/${{ env.BACKEND_REPOSITORY }}:${{ steps.vars.outputs.TAG }}|g" \
          taskflow-k8s/backend/deployment.yaml

      #########################################################
      # Update Frontend Deployment
      #########################################################

      - name: Update Frontend Image
        run: |
          sed -i "s|image: .*taskflow-frontend:.*|image: ${{ steps.login-ecr.outputs.registry }}/${{ env.FRONTEND_REPOSITORY }}:${{ steps.vars.outputs.TAG }}|g" \
          taskflow-k8s/frontend/deployment.yaml

      #########################################################
      # Commit Changes
      #########################################################

      - name: Commit Changes
        run: |
          cd taskflow-k8s

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update images to ${{ steps.vars.outputs.TAG }}"

          git push origin ${{ env.K8S_BRANCH }}
```
